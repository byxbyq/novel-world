    fate_arc: 幼年被玄冥从灭门惨案中救出，从此将生命全部交付给他
    goal: 清除一切试图接近落星崖封印的威胁
    story_state: 潜伏在落星崖周边的暗处，监视所有靠近封印的修仙者
    emotion: 冷漠、忠诚、内心渴望被认可
    inventory: [暗影匕首, 玄冥赐予的护符]

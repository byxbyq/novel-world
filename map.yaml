# ==========================================================================
# 小说世界 - 地图/地域配置
# 用户可直接编辑此文件修改各地形的命名池和生成权重。
#
# 结构说明：
#   themes — 每个主题的地形权重配置
#     tile_types:  生成时使用的地形类型列表
#     tile_weights: 对应类型的生成权重（越大越常见）
#     map_size:     默认地图尺寸 [宽, 高]
#
#   names — 地块命名池（按主题分类）
#     city_names:    城市地块命名池
#     ruin_names:    遗迹地块命名池（所有主题通用）
#     volcano_names: 火山地块命名池（所有主题通用）
#     region_names:  特殊地形命名池（山脉/森林/沼泽等）
#     place_names:   普通地块命名池
# ==========================================================================

themes:
  修仙:
    tile_types: [平原, 山脉, 森林, 水域, 遗迹, 沙漠, 城市]
    tile_weights: [15, 20, 18, 12, 15, 8, 12]
    map_size: [40, 25]
  日常:
    tile_types: [平原, 山脉, 森林, 水域, 城市]
    tile_weights: [25, 10, 15, 10, 40]
    map_size: [30, 20]
  科幻:
    tile_types: [平原, 沙漠, 城市, 遗迹, 山脉]
    tile_weights: [15, 25, 25, 20, 15]
    map_size: [40, 25]
  奇幻:
    tile_types: [平原, 山脉, 森林, 水域, 遗迹, 沙漠, 城市]
    tile_weights: [15, 18, 20, 10, 15, 7, 15]
    map_size: [40, 25]
  末世:
    tile_types: [平原, 沙漠, 遗迹, 城市, 沼泽]
    tile_weights: [10, 20, 25, 30, 15]
    map_size: [30, 20]
  恐怖:
    tile_types: [平原, 森林, 沼泽, 遗迹, 城市]
    tile_weights: [10, 20, 15, 30, 25]
    map_size: [25, 20]
  神:
    tile_types: [山脉, 平原, 水域, 遗迹, 城市]
    tile_weights: [25, 15, 15, 25, 20]
    map_size: [40, 25]


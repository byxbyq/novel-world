# ==========================================================================
# 小说世界 - 时间树（分支剧情）配置
#
# 核心概念：
#   world_timeline.yaml 只描述「必然发生」的世界事件。
#   本文档在此基础上增加「条件分支」— 某章节可因角色状态不同而有
#   不同的剧情走向。引擎在每章开始时评估条件，选择匹配的分支。
#
# 字段说明：
#   chapter     — 章节号
#   branches    — 条件分支（可选）
#      condition — 分支触发条件（见下方条件语法）
#      outline   — 情节提纲（bullet points），AI 据此 + 世界状态生成叙事
#
# ==========================================================================
#
# 条件语法：
#   支持以下条件类型，多个条件用 AND（同时满足）：
#
#   1. 角色关系：  "<角色A> 信任 <角色B>"    /  "<角色A> 排斥 <角色B>"
#                   "<角色A> <关系名> <角色B>"  (信任/排斥/敌对/同盟/疏远/亲近/中立)
#
#   2. 角色存活：  "<角色名> 存活"           /  "<角色名> 死亡"
#
#   3. 势力状态：  "<势力名> 活跃"           /  "<势力名> 覆灭"
#                   "<势力A> <关系名> <势力B>" (敌对/同盟/中立)
#
#   4. 默认兜底：  "default" — 没有任何条件匹配时走此分支
#
# ==========================================================================

timeline:
  # ================================================================
  # 第1章：线性推进，无分支
  # ================================================================
  - chapter: 1
    # 基础事件来自 world_timeline.yaml

  # ================================================================
  # 第2章：楚白登场，根据李青云与苏晚的关系分支
  # ================================================================
  - chapter: 2
    branches:
      - condition: "李青云 信任 苏晚"
        outline:
          - "苏晚主动分享天机阁情报"
          - "两人建立初步合作关系"
          - "信任关系加深，决定联手前往落星崖"
      - condition: "李青云 排斥 苏晚"
        outline:
          - "苏晚被疏远后独自行动"
          - "误入九幽宫暗哨陷阱，遭遇危险"
          - "引出九幽宫暗中布局的威胁"
      - condition: "default"
        outline:
          - "李青云对苏晚保持戒备"
          - "两人同行但各怀心思"
          - "关系处于暧昧观望状态"

  # ================================================================
  # 第3章：天玑子苏醒，根据楚白是否加入分支
  # ================================================================
  - chapter: 3
    branches:
      - condition: "李青云 信任 楚白"
        outline:
          - "楚白认出天玑子剑意源自天机阁古法"
          - "万剑宗与天机阁的过往秘事浮出水面"
          - "三人继续向落星崖深处前进"
      - condition: "李青云 排斥 楚白"
        outline:
          - "天玑子感应万剑宗功法后暴怒"
          - "误将楚白当作当年偷袭天机阁的仇敌"
          - "产生剑意冲突，考验李青云的斡旋能力"
      - condition: "default"
        outline:
          - "天玑子残魂独自在崖底游荡"
          - "被魔尊玄冥察觉并试图捕获炼化"
          - "魔气侵蚀程度加深"

  # ================================================================
  # 第4章：魔气外泄加剧，根据势力关系分支
  # ================================================================
  - chapter: 4
    branches:
      - condition: "天机阁 同盟 万剑宗"
        outline:
          - "万剑宗与天机阁残部联手布下护山大阵"
          - "暂时延缓魔气扩散速度"
          - "但封印已经松动，需要找到根本解法"
      - condition: "天机阁 敌对 万剑宗"
        outline:
          - "万剑宗趁乱封锁落星崖周边区域"
          - "阻止天机阁传人接近封印"
          - "势力冲突加剧，内部消耗严重"
      - condition: "default"
        outline:
          - "正道宗门各自为战、互不信任"
          - "魔气趁虚而入污染方圆百里"
          - "形势急剧恶化"

  # ================================================================
  # 第5章：最终决战
  # ================================================================
  - chapter: 5
    branches:
      - condition: "天玑子 存活"
        outline:
          - "天玑子将天机阁秘传剑诀刻入李青云神识"
          - "李青云悟出克制魔功的剑意"
          - "剑心通明境界突破"
      - condition: "天玑子 死亡"
        outline:
          - "李青云在崖壁上寻找天玑子留下的剑痕"
          - "自行参悟破魔之法"
          - "过程艰难，但剑心通明指引方向"
      - condition: "default"
        outline:
          - "李青云凭借剑心通明感应到剑谱残留气息"
          - "找到封印薄弱处"
          - "勉强打开突破口"

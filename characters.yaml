# ==========================================================================
# 小说世界 - 角色配置文件
# 用户可直接编辑此文件来增减角色，无需修改代码。
#
# 角色类型 (identity)：
#   protagonist - 主角
#   heroine     - 女主角
#   antagonist  - 反派
#   supporting  - 关键配角
#   npc         - 普通 NPC
#
# 技能类型：
#   被动特质  - 被动技能（永久生效）
#   主动手段  - 主动技能（可主动释放）
#   技能限制  - 限制/弱点
#   使用代价  - 代价/后遗症
# ==========================================================================

characters:
  # ================================================================
  # 角色1：主角「李青云」
  # ================================================================
  - name: 李青云
    entry_chapter: 1
    identity: protagonist
    faction: 天机阁
    position: [5, 10]
    age: 22
    gender: 男
    attrs:
      体力: 70
      智力: 60
      魅力: 50
      运气: 55
      攻击: 85
      防御: 60
      声望: 10
      财富: 5
    personality: 孤傲不群、向道之心坚定，外表冷漠内心炽热
    fate_arc: 师门被灭，背负复兴之任
    goal: 前往落星崖寻找师门遗失的镇派剑谱
    story_state: 身负师门之仇，独自踏上寻剑之路
    emotion: 悲愤、孤独、执着
    inventory: [天机阁残破令牌, 师门遗信]
    foreshadowing: [剑谱之谜可能与天道封印有关, 天机阁灭门另有隐情]
    skills:
      被动特质:
        name: 剑心通明
        description: 能感知方圆百里内灵力波动，但无法分辨善恶
        tags: [感知, 剑道, 灵力感应]
      主动手段:
        name: 万剑归宗
        description: 汇聚灵力化剑攻击，范围5格，持续3tick
        tags: [攻击, 剑道, 范围攻击, 修炼]
        trigger_condition: 主动释放，需要消耗灵力
        effect_range: 5
        duration: 3
      技能限制:
        name: 谋略短板
        description: 不擅长应对阴谋诡计，对精神类攻击几乎无防御力
        tags: [弱点, 精神防御]
        blind_spots: [阴谋诡计, 精神攻击, 谋略]
      使用代价:
        name: 灵力反噬
        description: 每次使用万剑归宗后，三天内灵力恢复速度减半
        tags: [副作用, 灵力消耗]
        side_effects: [灵力恢复速度减半，持续三天]
        karma_debt: 过度使用剑道之力，可能引发剑心蒙尘的心魔
    ultimate_goal: 重振师门天机阁

  # ================================================================
  # 角色2：反派「魔尊玄冥」
  # ================================================================
  - name: 魔尊玄冥
    entry_chapter: 1
    identity: antagonist
    faction: 九幽宫
    position: [30, 10]
    age: 500
    gender: 男
    attrs:
      体力: 90
      智力: 75
      魅力: 40
      运气: 30
      攻击: 95
      防御: 80
      声望: -50
      财富: 100
    personality: 冷酷霸道、亦正亦邪，内心深处渴望自由
    fate_arc: 被天道镇压千年，即将破封而出
    goal: 阻止任何人接近落星崖的远古封印
    story_state: 暗中布局，意图打破远古封印释放魔族
    emotion: 冷酷、不甘、执着
    inventory: [远古封印碎片, 九幽令]
    foreshadowing: [天道封印背后有更深的阴谋, 玄冥与天玑子八百年前有过交集]
    skills:
      被动特质:
        name: 魔气侵蚀
        description: 周围3格内修仙者灵力运转受阻，削弱30%
        tags: [魔道, 范围削弱, 灵力压制]
      主动手段:
        name: 暗影吞噬
        description: 发动黑暗力量吞噬目标，需要近身接触
        tags: [攻击, 魔道, 近身, 暗影]
        trigger_condition: 近身接触时发动
        effect_range: 1
        duration: 1
      技能限制:
        name: 阵法禁制
        description: 无法进入有强大阵法保护的区域，对光明系法术极度敏感
        tags: [弱点, 阵法, 光明系]
        blind_spots: [强大阵法保护的区域, 光明系法术]
      使用代价:
        name: 理智丧失
        description: 使用暗影吞噬会短暂失去理智，可能误伤同伴
        tags: [副作用, 失控]
        side_effects: [短暂失去理智，可能误伤同伴]
        karma_debt: 频繁使用暗影之力，魔化程度加深，人道渐远
    ultimate_goal: 打破天道枷锁，让魔族重获自由

  # ================================================================
  # 角色3：女主「苏晚」
  # ================================================================
  - name: 苏晚
    entry_chapter: 1
    identity: heroine
    faction: ""
    position: [6, 10]
    age: 19
    gender: 女
    attrs:
      体力: 40
      智力: 70
      魅力: 85
      运气: 75
      攻击: 10
      防御: 30
      声望: 20
      财富: 15
    personality: 温柔善良但内心坚韧，直觉敏锐
    fate_arc: 身世成谜，与天命之花有宿命关联
    goal: 跟随李青云，因为直觉告诉她此行至关重要
    story_state: 感受到冥冥中的牵引，决定跟随李青云前往落星崖
    emotion: 温柔、坚定、直觉敏锐
    inventory: [天命之花种子, 古朴玉佩]
    foreshadowing: [天命之花与远古封印存在关联, 苏晚的身世可能与落星崖有关]
    skills:
      被动特质:
        name: 灵犀直觉
        description: 对危险有预感，但无法判断危险来源
        tags: [感知, 直觉, 危险预感]
      主动手段:
        name: 净化之光
        description: 治愈受伤的修仙者，范围2格
        tags: [治愈, 光明系, 范围辅助, 修炼]
        trigger_condition: 对目标释放治愈之光
        effect_range: 2
        duration: 1
      技能限制:
        name: 战力薄弱
        description: 自身战斗力极弱，无法主动攻击
        tags: [弱点, 无攻击力]
        blind_spots: [主动攻击, 正面战斗]
      使用代价:
        name: 生命力反噬
        description: 过度使用治愈之力会反噬自身生命力
        tags: [副作用, 生命消耗]
        side_effects: [生命力下降，过度使用可能导致昏厥]
        karma_debt: 每次治愈他人都是在消耗自身本源，需要天命之花来根治
    ultimate_goal: 找到传说中能治愈一切的天命之花

  # ================================================================
  # 角色4：万剑宗剑修「楚白」
  # ================================================================
  - name: 楚白
    entry_chapter: 2
    identity: supporting
    faction: 万剑宗
    position: [15, 3]
    age: 24
    gender: 男
    attrs:
      体力: 65
      智力: 65
      魅力: 55
      运气: 40
      攻击: 80
      防御: 55
      声望: 30
      财富: 20
    personality: 沉稳内敛、重义气，对旧友心存愧疚，被师门恩情束缚
    fate_arc: 少年时与李青云同门学艺，后被万剑宗收为弟子，如今奉命追捕故人
    goal: 找到李青云，弄清楚剑谱真相再决定立场
    story_state: 奉万剑宗长老之命，暗中追踪李青云的踪迹
    emotion: 矛盾、愧疚、压抑
    inventory: [万剑宗令牌, 破虚剑谱残本]
    foreshadowing: [万剑宗长老可能与九幽宫有暗通, 楚白剑心裂痕终将引爆]
    skills:
      被动特质:
        name: 剑意通神
        description: 出剑速度比同阶快三成，但剑势过刚易折
        tags: [感知, 剑道, 速度]
      主动手段:
        name: 破虚剑诀
        description: 以剑气撕裂空间，可瞬间跨越3格距离发动致命一击
        tags: [攻击, 剑道, 空间, 突进]
        trigger_condition: 蓄力1tick后释放
        effect_range: 3
        duration: 1
      技能限制:
        name: 师门桎梏
        description: 受命于万剑宗长老，无法违抗师门铁令，常陷入两难
        tags: [弱点, 忠诚, 羁绊]
        blind_spots: [违抗师门命令, 背弃宗门]
      使用代价:
        name: 剑心裂痕
        description: 每次使用破虚剑诀都会在剑心上留下裂痕，积累到一定程度会剑道崩塌
        tags: [副作用, 剑心损伤]
        side_effects: [剑心受损，剑气威力逐次递减]
        karma_debt: 违背本心行事时，剑心裂痕加速扩大，最终可能沦为废人
    ultimate_goal: 在师门与道义之间找到第三条路

  # ================================================================
  # 角色5：九幽宫暗影统领「宁紫嫣」
  # ================================================================
  - name: 宁紫嫣
    entry_chapter: 1
    identity: antagonist
    faction: 九幽宫
    position: [28, 18]
    age: 32
    gender: 女
    attrs:
      体力: 55
      智力: 75
      魅力: 60
      运气: 35

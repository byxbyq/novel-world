    emotion: 睿智、孤寂、满怀期盼
    inventory: [天机阁秘卷残页, 魂晶碎片]
    foreshadowing: [天玑子知晓天道封印的真相, 八百年前天机阁覆灭与玄冥有关, 剑谱中藏有破解封印之法]
    skills:
      被动特质:
        name: 残魂感知
        description: 能感知天机阁血脉的灵力波动，覆盖整个落星崖区域
        tags: [感知, 天机, 血脉感应]
      主动手段:
        name: 天机推演
        description: 消耗残魂之力推演未来3tick内最可能的危险，但每次推演加速消散
        tags: [预知, 天机, 辅助, 修炼]
        trigger_condition: 感受到天机阁传人遭遇危险时触发
        effect_range: 10
        duration: 3
      技能限制:
        name: 残魂之躯
        description: 无法干涉物理世界，不能主动攻击，意识随时可能陷入混沌
        tags: [弱点, 灵体, 不稳定]
        blind_spots: [物理攻击, 长时间维持意识]
      使用代价:
        name: 执念消散
        description: 每次使用天机推演都会消耗残魂本源，推演次数有限，用完即彻底消散
        tags: [副作用, 灵魂消耗]
        side_effects: [残魂之力持续衰减，推演约3-5次后将彻底消散]
        karma_debt: 这份执念正是让他无法安息的枷锁，守护到最后才是解脱
    ultimate_goal: 找到天机阁的传人，揭开剑谱背后的真相

# ==========================================================================
# 小说世界 - 剧情/主线配置
# 包含小说元数据、世界初始化参数和主线剧情事件链。
#
# 字段说明：
#   novel_meta          — 小说元数据（标题、作者、类型）
#   world_init          — 世界初始化参数
#     theme             — 主题名称（须与 map.yaml 的 themes 键匹配）
#     main_objective    — 世界级主线目标（供 AI 叙事和势力目标生成）
#   story_arc           — 主线剧情事件链（每章主要剧情推进）
#     chapter           — 章节号
#     summary           — 本章剧情摘要（供引擎生成章节概要）
#     key_scenes        — 本章关键场景
#     faction_events    — 本章势力层面的大事件
# ==========================================================================

novel_meta:
  title: 落星崖剑歌
  author: 小说世界引擎
  genre: 修仙

world_init:
  theme: 修仙
  main_objective: 李青云在落星崖击败魔尊玄冥，寻回镇派剑谱，重振天机阁

story_arc:
  - chapter: 1
    summary: 李青云独自踏上寻剑之路，邂逅神秘少女苏晚，同时魔尊玄冥在暗中布局
    key_scenes:
      - 李青云在师门废墟前立誓
      - 苏晚在途中与李青云相遇
      - 玄冥感知封印松动，派宁紫嫣监视落星崖
    faction_events:
      - 落星崖封印松动，灵气波动传遍修仙界，各方势力开始暗中关注

  - chapter: 2
    summary: 万剑宗剑修楚白奉命下山追踪李青云，同时李青云在前往落星崖途中遭遇妖兽袭击
    key_scenes:
      - 楚白接到万剑宗密令
      - 李青云与苏晚遭遇妖兽围攻
      - 楚白暗中观察李青云，想起旧日情谊
    faction_events:
      - 万剑宗通过密报得知镇派剑谱下落，派弟子楚白下山暗中追查

  - chapter: 3
    summary: 天玑子残魂被唤醒，李青云首次接触师门传承线索，魔道势力开始试探
    key_scenes:
      - 天玑子残魂在落星崖深处苏醒
      - 李青云感受到天机阁血脉共鸣
      - 宁紫嫣试图阻止李青云靠近封印
    faction_events:
      - 落星崖深处的远古封印出现微弱裂痕，天玑子残魂被灵气波动唤醒

  - chapter: 4
    summary: 魔气外泄加剧，各方势力在落星崖周边集结，楚白面临师门与道义的抉择
    key_scenes:
      - 异化妖兽袭击周边村落
      - 正道宗门紧急召集
      - 楚白被师门施压，内心挣扎
    faction_events:
      - 魔气从封印裂痕中外泄，周边妖兽开始异化，落星崖进入警戒状态

  - chapter: 5
    summary: 最终决战在落星崖展开，李青云获得剑谱传承，众人联手阻止玄冥破封
    key_scenes:
      - 李青云在天玑子指引下获得镇派剑谱
      - 各势力在封印前展开最终决战
      - 玄冥破封之际，众人合力加固封印
    faction_events:
      - 远古封印出现明显裂痕，魔尊玄冥加速破封计划，正道宗门联合应对

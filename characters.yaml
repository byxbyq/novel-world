    skills:
      被动特质:
        name: 暗影潜行
        description: 在阴影中移动时几乎不可被感知，但每次现身都会消耗大量灵力
        tags: [隐匿, 魔道, 感知]
      主动手段:
        name: 影缚术
        description: 操纵目标的影子将其束缚，范围3格，持续2tick
        tags: [控制, 魔道, 暗影, 范围攻击]
        trigger_condition: 目标处于非光照区域时发动
        effect_range: 3
        duration: 2
      技能限制:
        name: 光明恐惧
        description: 对光明系法术极度敏感，在强光下战力减半，无法施展隐匿
        tags: [弱点, 光明系, 环境依赖]
        blind_spots: [强光环境, 光明系攻击]
      使用代价:
        name: 影蚀反噬
        description: 过度使用影缚术会被暗影反噬，逐渐失去情感
        tags: [副作用, 情感丧失]
        side_effects: [情感逐渐麻木，共情能力下降]
        karma_debt: 越是忠诚于玄冥，越迷失自我——她的存在正在被暗影吞噬
    ultimate_goal: 守护那个在绝境中给了自己活下去理由的人


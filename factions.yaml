# ==========================================================================
# 小说世界 - 势力配置文件
# 用户可直接编辑此文件增减势力、修改势力关系，无需修改代码。
#
# 字段说明：
#   id          — 唯一标识（用于代码内部引用）
#   name        — 势力名称（与 characters.yaml 中 faction 字段对应）
#   description — 势力背景描述
#   color       — 地图/UI 中使用的颜色（十六进制）
#   goals       — 势力目标列表（用于驱动势力行为）
#   enemies     — 敌对势力名列表（双向敌对，引擎自动处理）
#   allies      — 同盟势力名列表（双向同盟，引擎自动处理）
#   controlled_resources — 势力控制的战略资源
#   leader_id   — 领袖角色名（可选，与 characters.yaml 中 name 对应）
# ==========================================================================

factions:
  # ================================================================
  # 天机阁 — 正道旧贵，已没落但底蕴仍在
  # ================================================================
  - id: tianji_ge
    name: 天机阁
    description: 上古修仙宗门，以天机推演和剑道闻名于世。曾为修仙界正道领袖，后遭魔道偷袭师门被灭，如今只剩废墟与残篇。
    color: "#4A90D9"
    goals:
      - 寻找失落在落星崖的镇派剑谱
      - 重振天机阁昔日荣光
      - 培养新一代天机阁传人
    enemies:
      - 九幽宫
    allies: []
    controlled_resources:
      - 天机秘典
      - 残剑遗迹
    leader_id: 李青云

  # ================================================================
  # 万剑宗 — 当世第一剑修宗门
  # ================================================================
  - id: wanjian_zong
    name: 万剑宗
    description: 当世第一剑修宗门，以剑道立派，门规森严。表面上维护正道秩序，暗中觊觎天机阁遗失的镇派剑谱。
    color: "#E8A850"
    goals:
      - 夺取镇派剑谱以增强宗门实力
      - 维护正道宗门间平衡
      - 压制魔道势力扩张
    enemies: []
    allies: []
    controlled_resources:
      - 万剑剑冢
      - 灵脉矿藏
    leader_id: ""

  # ================================================================
  # 九幽宫 — 魔道势力，蛰伏千年等待破封
  # ================================================================
  - id: jiuyou_gong
    name: 九幽宫
    description: 魔道第一势力，千年前被天道镇压于落星崖深处。如今封印松动，魔尊玄冥正暗中集结力量，企图彻底打破封印。
    color: "#B84A4A"
    goals:
      - 打破远古封印释放魔族
      - 消灭正道势力，建立魔族统治
      - 清除一切试图加固封印的修仙者
    enemies:
      - 天机阁
    allies: []
    controlled_resources:
      - 魔气之源
      - 暗影结晶
    leader_id: 魔尊玄冥

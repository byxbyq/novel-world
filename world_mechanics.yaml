# ==========================================================================
# 小说世界 - 世界机制/环境技能配置
# 世界技能是全局规则，会对所有角色的对应标签技能产生修正效果。
#
# 字段说明：
#   name         — 规则名称
#   description  — 规则的自然语言描述
#   effect       — 效果的文字说明（供 AI 叙事参考）
#   affects_tags — 影响哪些技能标签（与 characters.yaml 中技能 tags 匹配）
#   modifier     — 修正系数（>1 增强，<1 削弱，0.0 完全失效）
# ==========================================================================

world_name: 修仙界

rules:
  - name: 灵气潮汐
    description: 每隔一段时间灵气浓度变化，影响所有修炼类技能
    effect: 修炼类技能效果在 0.8~1.2 之间随灵气潮汐波动
    affects_tags: [修炼]
    modifier: 1.0  # 实际运行时引擎会动态调整 0.8~1.2

  - name: 天道压制
    description: 魔道功法在正道领地效果减半
    effect: 魔道类技能在正道势力范围内 modifier 降为 0.5
    affects_tags: [魔道]
    modifier: 0.5

  - name: 禁制之地
    description: 落星崖等禁区中，所有感知类技能失效
    effect: 在禁区内，感知类技能 modifier 降为 0.0（完全无效）
    affects_tags: [感知]
    modifier: 0.0
